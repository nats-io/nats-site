baseURL = "https://nats.io/"
locale = "en-us"
defaultLanguage = "en"
title = "NATS.io"
enableRobotsTXT = true

pygmentsCodeFences = "true"
pygmentsUseClasses = "true"
pygmentsStyle = "native"

[markup.goldmark.renderer]
unsafe = true

# Hugo denies text/html content by default; content/nats_connect.html needs it.
[security]
allowContent = ['^text/(markdown|html)$']

[params]
tagline = "Cloud Native, Open Source, High-performance Messaging"
favicon = "favicon.ico"
font_awesome_version = "6.5.1"
description = "NATS is a connective technology powering modern distributed systems, unifying Cloud, On-Premise, Edge, and IoT."
images = ["/img/new_social_nats.png"]

[mediaTypes."text/netlify"]
delimiter = ""

[outputFormats.REDIRECTS]
mediaType = "text/netlify"
baseName = "_redirects"

[outputs]
home = [ "HTML", "REDIRECTS" ]
taxonomy = []
term = []

[[params.social]]
label = "X"
icon = "x-twitter"
url = "https://x.com/nats_io"
color = "x-twitter-black"

[[params.social]]
label = "GitHub"
icon = "github"
url = "https://github.com/nats-io"

[[params.social]]
label = "Slack"
icon = "slack"
url = "https://slack.nats.io"
color = "slack-purple"

[[params.social]]
label = "YouTube"
icon = "youtube"
url = "https://www.youtube.com/@nats_io"
color = "youtube-red"

[[params.social]]
label = "Stack Overflow"
icon = "stack-overflow"
url = "https://stackoverflow.com/questions/tagged/nats.io"
color = "stack-orange"

[[menu.main]]
name = "About"
weight = 1
identifier = "about"
url = "/about/"

[[menu.main]]
name = "Download"
weight = 2
identifier = "download"
url = "/download/"

[[menu.main]]
name = "Documentation"
weight = 3
identifier = "doc"
url = "https://docs.nats.io"

[[menu.main]]
name = "Blog"
weight = 5
identifier = "blog"
url = "/blog/"

[[menu.main]]
name = "Support"
weight = 7
identifier = "support"
url = "/support/"

[[menu.main]]
name = "Community"
weight = 6
identifier = "community"
url = "/community/"

