<div class="ref-wrap">
<table class="ref">
  <thead><tr><th scope="col">Name</th><th scope="col">Description</th><th scope="col">Developer</th><th scope="col">Support</th></tr></thead>
  <tbody>
    {{- range hugo.Data.addons.addons }}
    <tr>
      <td><a href="{{ .home }}">{{ .name }}</a></td>
      <td>{{ .description | markdownify }}</td>
      <td>
        {{- range .authors }}
        <span class="who">{{ if .authorHome }}<a href="{{ .authorHome }}">{{ .author }}</a>{{ else }}{{ .author }}{{ end }}</span>
        {{- end }}
      </td>
      <td>{{ .support }}</td>
    </tr>
    {{- end }}
  </tbody>
</table>
</div>
