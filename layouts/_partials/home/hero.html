  <div>
    <h1 id="hero-title">The connectivity and data layer for distributed systems.</h1>
    <p class="sub">NATS is high-performance, lightweight, open-source infrastructure for modern distributed systems, cloud to edge, and agentic AI.</p>
    <div class="actions">
      <a class="btn primary" href="https://docs.nats.io/concepts/getting-started/"><i class="fa-solid fa-book-open" aria-hidden="true"></i>Get started</a>
      <a class="btn" href="https://slack.nats.io"><i class="fa-brands fa-slack" aria-hidden="true"></i>Join the community</a>
      <a class="quiet" href="{{ "/support/" | relURL }}">or talk with an expert &rarr;</a>
    </div>
  </div>
  <figure class="sys">
    <svg id="sys" viewBox="0 0 440 376" role="img" aria-labelledby="sys-t sys-d">
      <title id="sys-t">One NATS system</title>
      <desc id="sys-d">Services, devices and AI agents connect to one NATS system. It provides messaging, where one message fans out to every subscriber; streaming, where messages append to a log that a consumer reads through; key-value and object storage, where a key's value updates and its revision increases; and services, where requests are balanced across instances. It runs at the edge, in clusters and across clouds, with accounts isolating tenants.</desc>
      <rect class="sx-chip" x="16" y="6" width="128" height="24" rx="3"/><text class="sx-n" x="80" y="22" text-anchor="middle">services</text>
      <rect class="sx-chip" x="156" y="6" width="128" height="24" rx="3"/><text class="sx-n" x="220" y="22" text-anchor="middle">devices</text>
      <rect class="sx-chip" x="296" y="6" width="128" height="24" rx="3"/><text class="sx-n" x="360" y="22" text-anchor="middle">AI agents</text>
      <path class="sx-link" d="M80 30 V52 M220 30 V52 M360 30 V52"/>
      <rect class="sx-sys" x="8" y="52" width="424" height="278" rx="3"/>

      <rect class="sx-band" x="16" y="78" width="408" height="48" rx="3"/>
      <rect x="28" y="91" width="8" height="8" rx="1.5" class="sw-blue"/>
      <text class="sx-n" x="44" y="99">Messaging</text>
      <text class="sx-d" x="44" y="115">pub/sub, request/reply, queues</text>
      <rect class="sx-band" x="16" y="134" width="408" height="48" rx="3"/>
      <rect x="28" y="147" width="8" height="8" rx="1.5" class="sw-green"/>
      <text class="sx-n" x="44" y="155">Streaming (JetStream)</text>
      <text class="sx-d" x="44" y="171">durable streams, replay</text>
      <rect class="sx-band" x="16" y="190" width="408" height="48" rx="3"/>
      <rect x="28" y="203" width="8" height="8" rx="1.5" class="sw-dkblue"/>
      <text class="sx-n" x="44" y="211">Key-value and object store</text>
      <text class="sx-d" x="44" y="227">buckets built on streams</text>
      <rect class="sx-band" x="16" y="246" width="408" height="48" rx="3"/>
      <rect x="28" y="259" width="8" height="8" rx="1.5" class="sw-lgreen"/>
      <text class="sx-n" x="44" y="267">Services</text>
      <text class="sx-d" x="44" y="283">discovery, stats, balancing</text>

      <g id="s-cells"><rect class="s-cell on" x="272" y="151" width="13" height="14" rx="1.5"/><rect class="s-cell on" x="288" y="151" width="13" height="14" rx="1.5"/><rect class="s-cell on" x="304" y="151" width="13" height="14" rx="1.5"/><rect class="s-cell on" x="320" y="151" width="13" height="14" rx="1.5"/><rect class="s-cell on" x="336" y="151" width="13" height="14" rx="1.5"/><rect class="s-cell on" x="352" y="151" width="13" height="14" rx="1.5"/><rect class="s-cell" x="368" y="151" width="13" height="14" rx="1.5"/><rect class="s-cell" x="384" y="151" width="13" height="14" rx="1.5"/><rect class="s-cell" x="400" y="151" width="13" height="14" rx="1.5"/></g>
