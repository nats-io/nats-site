{{ define "title" }}Page not found | {{ site.Title }}{{ end }}

{{ define "main" }}
<section class="wrap notfound">
  <p class="code">404</p>
  <h1>Page not found</h1>
  <p>The link you followed is broken, or the page has moved. The documentation lives at <a href="https://docs.nats.io">docs.nats.io</a>, and the community can help on <a href="https://slack.nats.io">Slack</a>.</p>
  <div class="actions">
    <a class="btn primary" href="{{ "/" | relURL }}">Back to home</a>
    <a class="btn" href="https://docs.nats.io">Documentation</a>
  </div>
</section>
{{ end }}
