<!DOCTYPE html>
<html{{ with site.Language.Locale }} lang="{{ . }}"{{ end }}>
  <head>
    {{ partial "meta.html" . }}
    <title>{{ block "title" . }}{{ site.Title }} &ndash; {{ site.Params.tagline }}{{ end }}</title>
    {{ partial "css.html" . }}
    {{ partial "favicon.html" . }}
  </head>
  <body>
    {{ partial "navbar.html" . }}
    <main>
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    {{ partial "scripts.html" . }}
  </body>
</html>
